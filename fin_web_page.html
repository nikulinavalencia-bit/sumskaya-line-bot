<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Статус платежей · SUMSKAYA LINE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #eef1ef;
    --surface: #ffffff;
    --surface-2: #f5f7f6;
    --ink: #14201c;
    --ink-soft: #5c6b65;
    --line: #dde3e0;
    --accent: #14624f;
    --accent-soft: #dcefe8;
    --warn: #8a5a0c;
    --warn-soft: #fbeed3;
    --danger: #a5382c;
    --danger-soft: #f9e1dd;
    --info: #2a5673;
    --info-soft: #dfeaf2;
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0e1513;
      --surface: #161f1c;
      --surface-2: #1c2723;
      --ink: #e3eae7;
      --ink-soft: #94a39d;
      --line: #27332e;
      --accent: #57c9a8;
      --accent-soft: #10312a;
      --warn: #e0ab5f;
      --warn-soft: #33270f;
      --danger: #e98a7c;
      --danger-soft: #38201c;
      --info: #8ab6d6;
      --info-soft: #14252f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0e1513; --surface: #161f1c; --surface-2: #1c2723;
    --ink: #e3eae7; --ink-soft: #94a39d; --line: #27332e;
    --accent: #57c9a8; --accent-soft: #10312a;
    --warn: #e0ab5f; --warn-soft: #33270f;
    --danger: #e98a7c; --danger-soft: #38201c;
    --info: #8ab6d6; --info-soft: #14252f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

  header.bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--ground);
    border-bottom: 1px solid var(--line);
    padding-block: 14px 12px;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 13px; }
  .spacer { flex: 1 1 auto; }
  button.ghost {
    font: inherit; font-size: 13px; color: var(--ink-soft);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button.ghost:hover { color: var(--ink); }
  button.ghost:focus-visible, .chip:focus-visible, a.doc:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 13px; font-weight: 500; color: var(--ink-soft); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
  .filters .sep { flex-basis: 100%; height: 0; }

  .period {
    display: flex; align-items: center; gap: 4px; margin-top: 16px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px; width: max-content; max-width: 100%;
  }
  .period button {
    font: inherit; font-size: 15px; line-height: 1; color: var(--ink-soft);
    background: transparent; border: 0; border-radius: 999px;
    padding: 7px 11px; cursor: pointer;
  }
  .period button:hover { background: var(--surface-2); color: var(--ink); }
  .period .now { font-size: 13px; font-weight: 600; }
  .period label {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    min-width: 9.5em; justify-content: center;
  }
  .period label:hover { background: var(--surface-2); }
  .period input[type="month"] {
    position: absolute; width: 1px; height: 1px; opacity: 0;
    pointer-events: none; margin: 0; padding: 0; border: 0;
  }
  .period label:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chip {
    font: inherit; font-size: 13px; font-weight: 500;
    background: var(--surface); color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .row {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start;
  }
  .row.paid { border-left: 3px solid var(--accent); }
  .row.attention { border-left: 3px solid var(--warn); }
  .name { font-weight: 600; }
  .meta { color: var(--ink-soft); font-size: 13px; }
  .sum { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .pill {
    display: inline-block; font-size: 12px; font-weight: 600;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .pill.ok { background: var(--accent-soft); color: var(--accent); }
  .pill.wait { background: var(--info-soft); color: var(--info); }
  .pill.attention { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
  .rowfoot { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  a.doc {
    font-size: 13px; font-weight: 500; text-decoration: none;
    color: var(--accent); background: var(--accent-soft);
    border-radius: 8px; padding: 5px 11px;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; }

  .empty, .error {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px 20px; text-align: center; color: var(--ink-soft); margin-top: 16px;
  }
  .error { border-color: var(--danger); color: var(--danger); }
  footer { color: var(--ink-soft); font-size: 12.5px; margin-top: 22px; }

  @media (max-width: 460px) {
    .row { grid-template-columns: 1fr; }
    .sum { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div>
      <h1>Статус платежей</h1>
      <div class="sub" id="who">SUMSKAYA LINE</div>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="refresh" type="button">Обновить</button>
  </header>

  <section class="period" id="period" hidden>
    <button type="button" id="mprev" aria-label="Предыдущий месяц">‹</button>
    <label id="mlabel">
      <span id="mtext">—</span>
      <input type="month" id="mpick" aria-label="Выбрать месяц">
    </label>
    <button type="button" id="mnext" aria-label="Следующий месяц">›</button>
    <button type="button" id="mall" class="now">Весь период</button>
  </section>

  <section class="tiles" id="tiles" hidden></section>
  <section class="filters" id="filters" hidden></section>
  <section class="list" id="list"></section>
  <div class="empty" id="loading">Загружаю…</div>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var STATE = { rows: [], locales: [], viewer: null, local: "all", status: "all",
               month: null, today: "" };

  var STATUS = {
    "новый":            { pill: "wait",      label: "Принят",              hint: "ждёт распознавания" },
    "распознан":        { pill: "attention", label: "На проверке",         hint: "фин. директор проверяет данные" },
    "нужен IBAN":       { pill: "attention", label: "Нужны реквизиты",     hint: "не хватает IBAN" },
    "готов к ремесе":   { pill: "ok",        label: "В очереди на оплату", hint: "войдёт в ближайшую ремесу" },
    "исключён":         { pill: "bad",       label: "Отложен",             hint: "перенесён на следующий платёжный день" },
    "в ремесе":         { pill: "ok",        label: "В ремесе",            hint: "" },
    "отправлено в банк":{ pill: "ok",        label: "Отправлено в банк",   hint: "" },
    "оплачено":         { pill: "ok",        label: "Оплачено",            hint: "" }
  };

  function money(v) {
    if (!v) return "—";
    return v.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function headers() {
    var h = {};
    if (tg && tg.initData) h["X-TG-Init-Data"] = tg.initData;
    return h;
  }

  function load(force) {
    var url = "/pagos/api/data" + (force ? "?force=1" : "");
    return fetch(url, { headers: headers(), credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) throw new Error("auth");
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  function tiles() {
    var rows = inPeriod();           // плитки считаем по выбранному месяцу и локали
    var paid = rows.filter(function (r) { return r.estado === "оплачено"; });
    var queue = rows.filter(function (r) {
      return ["готов к ремесе", "в ремесе", "отправлено в банк"].indexOf(r.estado) >= 0;
    });
    var attention = rows.filter(function (r) {
      return ["распознан", "нужен IBAN", "новый"].indexOf(r.estado) >= 0;
    });
    var sum = queue.reduce(function (a, r) { return a + (r.total || 0); }, 0);
    var cells = [
      ["Всего документов", rows.length, ""],
      ["В очереди на оплату", queue.length, money(sum)],
      ["Ждут проверки", attention.length, ""],
      ["Оплачено", paid.length, ""]
    ];
    var el = document.getElementById("tiles");
    el.innerHTML = cells.map(function (c) {
      return '<div class="tile"><div class="k">' + esc(c[0]) + '</div><div class="v">' +
        esc(c[1]) + (c[2] ? ' <small>' + esc(c[2]) + '</small>' : '') + '</div></div>';
    }).join("");
    el.hidden = false;
  }

  function localList() {
    // список подразделений приходит с сервера — кнопки есть всегда,
    // даже если по локали ещё ни одного документа
    var out = (STATE.locales || []).slice();
    var have = {};
    out.forEach(function (l) { have[l.code] = true; });
    STATE.rows.forEach(function (r) {
      if (r.local_code && !have[r.local_code]) {
        have[r.local_code] = true;
        out.push({ code: r.local_code, label: r.local || r.local_code });
      }
    });
    return out;
  }

  function chip(kind, value, label, count) {
    var on = STATE[kind] === value;
    return '<button class="chip" type="button" data-kind="' + kind + '" data-v="' + esc(value) +
      '" aria-pressed="' + on + '">' + esc(label) +
      (count == null ? "" : ' <span style="opacity:.65">' + count + "</span>") + "</button>";
  }

  function filters() {
    var el = document.getElementById("filters");
    var base = inMonth();            // счётчики локалей — в рамках выбранного месяца
    var html = chip("status", "all", "Все") +
      chip("status", "open", "В работе") +
      chip("status", "paid", "Оплаченные") +
      '<span class="sep"></span>' +
      chip("local", "all", "Все локали", base.length);
    html += localList().map(function (l) {
      var n = base.filter(function (r) { return r.local_code === l.code; }).length;
      return chip("local", l.code, l.label, n);
    }).join("");
    el.innerHTML = html;
    el.hidden = false;
    Array.prototype.forEach.call(el.querySelectorAll(".chip"), function (b) {
      b.addEventListener("click", function () {
        STATE[b.dataset.kind] = b.dataset.v;
        render();
      });
    });
  }

  // ---------- месяц ----------
  var MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль",
                "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];

  function monthLabel(m) {
    if (!m) return "Весь период";
    var p = m.split("-");
    return MONTHS[(parseInt(p[1], 10) || 1) - 1] + " " + p[0];
  }

  function shiftMonth(m, step) {
    var p = (m || "").split("-");
    var y = parseInt(p[0], 10), mo = parseInt(p[1], 10) + step;
    if (!y) return m;
    while (mo < 1) { mo += 12; y -= 1; }
    while (mo > 12) { mo -= 12; y += 1; }
    return y + "-" + (mo < 10 ? "0" : "") + mo;
  }

  function inMonth() {
    if (!STATE.month) return STATE.rows;
    return STATE.rows.filter(function (r) { return r.mes === STATE.month; });
  }

  function inPeriod() {
    return inMonth().filter(function (r) {
      return STATE.local === "all" || r.local_code === STATE.local;
    });
  }

  function period() {
    var el = document.getElementById("period");
    document.getElementById("mtext").textContent = monthLabel(STATE.month);
    var pick = document.getElementById("mpick");
    if (STATE.month) pick.value = STATE.month;
    var all = document.getElementById("mall");
    all.textContent = STATE.month ? "Весь период" : "← вернуть месяц";
    el.hidden = false;
  }

  function bindPeriod() {
    document.getElementById("mprev").addEventListener("click", function () {
      STATE.month = shiftMonth(STATE.month || STATE.today, -1);
      render();
    });
    document.getElementById("mnext").addEventListener("click", function () {
      STATE.month = shiftMonth(STATE.month || STATE.today, 1);
      render();
    });
    document.getElementById("mpick").addEventListener("change", function () {
      STATE.month = this.value || "";
      render();
    });
    document.getElementById("mall").addEventListener("click", function () {
      STATE.month = STATE.month ? "" : STATE.today;
      render();
    });
  }

  function visible() {
    return inPeriod().filter(function (r) {
      if (STATE.status === "paid" && r.estado !== "оплачено") return false;
      if (STATE.status === "open" && r.estado === "оплачено") return false;
      return true;
    });
  }

  function rowHtml(r) {
    var st = STATUS[r.estado] || { pill: "wait", label: r.estado, hint: "" };
    var cls = r.estado === "оплачено" ? "paid" :
      (st.pill === "attention" || st.pill === "bad" ? "attention" : "");
    var head = esc(r.proveedor || "Поставщик не указан");
    var line2 = [r.local, r.fecha + (r.hora ? " " + r.hora : ""), r.autor]
      .filter(Boolean).map(esc).join(" · ");
    var docs = "";
    if (r.has_doc) docs += '<a class="doc" href="/pagos/file/' + esc(r.id) + '" target="_blank" rel="noopener">Фактура</a>';
    if (r.has_just) docs += '<a class="doc" href="/pagos/file/' + esc(r.id) + '?k=just" target="_blank" rel="noopener">Хустификанте</a>';
    if (!r.has_just && r.justificante && r.estado !== "оплачено") {
      docs += '<span class="meta">хустификанте придёт после оплаты</span>';
    }
    var num = r.numero ? '<span class="mono">' + esc(r.numero) + "</span>" : "";
    var fecha = r.fecha_factura ? esc(r.fecha_factura) : "";
    var detail = [num, fecha].filter(Boolean).join(" · ");
    var paidAt = r.pagado ? ' · оплачено ' + esc(r.pagado) : "";

    return '<article class="row ' + cls + '">' +
      '<div><div class="name">' + head + "</div>" +
      '<div class="meta">' + line2 + "</div>" +
      (detail ? '<div class="meta">' + detail + "</div>" : "") +
      "</div>" +
      '<div><div class="sum">' + esc(money(r.total)) + "</div>" +
      '<div style="text-align:right;margin-top:4px"><span class="pill ' + st.pill + '">' +
      esc(st.label) + "</span></div></div>" +
      '<div class="rowfoot">' + docs +
      (st.hint ? '<span class="meta">' + esc(st.hint) + paidAt + "</span>"
               : (paidAt ? '<span class="meta">' + paidAt.replace(" · ", "") + "</span>" : "")) +
      "</div></article>";
  }

  function render() {
    period();
    tiles();
    filters();
    var rows = visible();
    var list = document.getElementById("list");
    if (rows.length) {
      list.innerHTML = rows.map(rowHtml).join("");
      return;
    }
    var hint = STATE.month
      ? "За " + monthLabel(STATE.month).toLowerCase() +
        (STATE.local === "all" ? "" : " по этой локали") +
        " документов нет. Полистай месяцы стрелками или нажми «Весь период»."
      : "Здесь пока ничего нет. Загрузи документ на оплату в боте: 💶 Финансы → Оплата.";
    list.innerHTML = '<div class="empty">' + esc(hint) + "</div>";
  }

  function fail(kind) {
    document.getElementById("loading").hidden = true;
    var list = document.getElementById("list");
    list.innerHTML = kind === "auth"
      ? '<div class="error">Ссылка устарела. Откройте страницу заново из бота: ' +
        "💶 Финансы → Статус платежей.</div>"
      : '<div class="error">Не получилось загрузить данные. Попробуйте обновить страницу.</div>';
  }

  function boot(force) {
    load(force).then(function (data) {
      STATE.rows = data.rows || [];
      STATE.locales = data.locales || [];
      STATE.viewer = data.viewer || {};
      STATE.today = data.month || "";
      if (STATE.month === null) {
        // первый заход — открываем текущий месяц; если он пуст, показываем всё,
        // чтобы страница не встретила пустым экраном
        STATE.month = STATE.today;
        if (!inMonth().length && STATE.rows.length) STATE.month = "";
      }
      document.getElementById("loading").hidden = true;
      document.getElementById("who").textContent =
        (STATE.viewer.full ? "Все локали · " : "Мои документы · ") + "SUMSKAYA LINE";
      document.getElementById("foot").textContent =
        "Обновлено " + (data.updated || "") + ". Данные берутся из таблицы бота.";
      render();
    }).catch(function (e) {
      fail(e && e.message === "auth" ? "auth" : "net");
    });
  }

  bindPeriod();

  document.getElementById("refresh").addEventListener("click", function () {
    document.getElementById("loading").hidden = false;
    document.getElementById("loading").textContent = "Обновляю…";
    boot(true);
  });

  boot(false);
})();
</script>
</body>
</html>
